name: Arduino Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arduino-platform: 
           #- "arduino:avr"
           #- "esp32:esp32"
          - "STMicroelectronics:stm32@2.8.1"
        include:
           #- arduino-platform: "arduino:avr"
             #fqbn: "arduino:avr:diecimila"
             #artifact-name: "avr-diecimila"
          #- arduino-platform: "esp32:esp32"
            #fqbn: "esp32:esp32:esp32"
            #artifact-name: "esp32"
          - arduino-platform: "STMicroelectronics:stm32@2.8.1"
            fqbn: "STMicroelectronics:stm32:GenF0:pnum=GENERIC_F072CBTX,opt=o3std"
            artifact-name: "stm32f072"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Create work directory
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$PWD" "$HOME/Arduino/FM-DX-Tuner"

      - name: Install platform and libraries
        run: |
          arduino-cli core update-index --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core install ${{ matrix.arduino-platform }} --additional-urls https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          
          # Naklonování raw TinyUSB stacku
          git clone --branch 0.15.0 --depth 1 https://github.com/hathach/tinyusb.git "$HOME/Arduino/libraries/tinyusb"
          
          # Umělé vytvoření metadat, aby arduino-cli knihovnu poznalo
          cat <<EOF > "$HOME/Arduino/libraries/tinyusb/library.properties"
          name=tinyusb
          version=0.15.0
          author=hathach
          maintainer=hathach
          sentence=TinyUSB stack
          paragraph=Open source cross-platform USB stack
          category=Communication
          url=https://github.com/hathach/tinyusb
          architectures=*
          EOF

      - name: Compile Sketch
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" "$HOME/Arduino/FM-DX-Tuner" --warnings more --output-dir ./build-artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.artifact-name }}
          path: ./build-artifacts/
